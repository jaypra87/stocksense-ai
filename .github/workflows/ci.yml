name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: stocksense
          POSTGRES_PASSWORD: stocksense
          POSTGRES_DB: stocksense
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U stocksense"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # `app` is an ordinary role created below; see the psql step.
      DATABASE_URL: postgresql+psycopg://app:app@localhost:5432/stocksense
      # Tests use an in-memory stand-in; this just keeps the client from
      # waiting on a real host.
      REDIS_URL: redis://localhost:6379/0
      MARKET_DATA_PROVIDER: fake
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check app tests
      # The postgres image makes POSTGRES_USER a superuser, and superusers
      # bypass row-level security entirely, so the RLS tests would pass for
      # the wrong reason (and Postgres 16 refuses to demote its bootstrap
      # user). Migrations and tests therefore run as `app`, an ordinary role
      # that owns the tables it creates, which is how production connects.
      - run: |
          psql postgresql://stocksense:stocksense@localhost:5432/stocksense <<'SQL'
          CREATE ROLE app LOGIN PASSWORD 'app' NOSUPERUSER NOBYPASSRLS;
          GRANT ALL ON DATABASE stocksense TO app;
          GRANT ALL ON SCHEMA public TO app;
          SQL
      - run: alembic upgrade head
      - run: pytest -q

  frontend:
    name: Frontend (typecheck + lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
        env:
          BACKEND_URL: http://localhost:8000

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: bash scripts/check-secrets.sh --history
