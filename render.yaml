# Render Blueprint — deploys the StockSense backend as a Docker web service.
# In Render: New → Blueprint → point at this repo. Then set the three sync:false
# env vars (DATABASE_URL, REDIS_URL, CORS_ORIGINS) in the dashboard.
#
# Postgres (Neon) and Redis (Upstash) are external free-tier services — paste
# their connection URLs into DATABASE_URL / REDIS_URL.
#
# The Celery worker + beat (scheduled alert checks) are intentionally omitted:
# Render has no free background-worker tier. Everything else works without them;
# alerts simply won't auto-fire. See the commented block below to add them later.

services:
  - type: web
    name: stocksense-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    dockerCommand: sh start.sh
    plan: free
    region: virginia      # co-located with the Neon US East database
    healthCheckPath: /api/v1/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: MARKET_DATA_PROVIDER
        value: yfinance      # real Yahoo Finance data (may be rate-limited on cloud IPs; set to "fake" to fall back to synthetic)
      - key: JWT_SECRET
        generateValue: true  # Render generates a strong secret
      - key: EMAIL_ENCRYPTION_KEY
        sync: false          # REQUIRED: `openssl rand -hex 32`. Emails are stored encrypted with it;
                             # losing it makes existing addresses unreadable, so back it up.
      - key: PROXY_SHARED_SECRET
        sync: false          # same value as API_PROXY_SECRET on Vercel; lets the backend trust the
                             # client IP the frontend proxy reports (`openssl rand -hex 32`)
      - key: TRUSTED_CLIENT_IP_HEADER
        value: CF-Connecting-IP   # Render fronts services with Cloudflare, which stamps the real
                                  # client address here; X-Forwarded-For ends in Cloudflare's own IP
      - key: TURNSTILE_SECRET_KEY
        sync: false          # Cloudflare Turnstile secret key (bot protection). Optional but
                             # strongly recommended: without it no challenge is ever issued.
      - key: BCRYPT_ROUNDS
        value: "10"          # free tier has a throttled shared CPU, where the default 12 costs ~1.5s per login
      - key: DATABASE_URL
        sync: false          # paste your Neon connection string (postgresql+psycopg://…)
      - key: REDIS_URL
        sync: false          # paste your Upstash rediss:// URL (TLS). Optional: the cache fails open, so an
                             # unset/dead Redis only costs speed — check /api/v1/health/deep to confirm which.
      - key: CORS_ORIGINS
        sync: false          # your Vercel URL, e.g. https://stocksense-ai.vercel.app. Also the
                             # allow-list for the Origin check on state-changing requests.

